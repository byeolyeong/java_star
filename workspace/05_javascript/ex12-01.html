<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <script>
    /*
    * 함수를 만드는 방법 4 - 화살표 함수
      - 함수 표현식의 대안으로 간결하게 함수 정의
      - 실행할 코드가 하나만 있다면 함수 본문의 중괄호 생략 가능
      - 함수 본문의 중괄호가 생략될 경우 함수의 코드가 자동으로 리턴값으로 사용됨
      - 매개 변수가 하나만 있다면 매개변수의 괄호 생략 가능
    */
    // 선언문 방식의 함수 정의
    function add(x, y){
      // 콘손 값이 10, 20이니 x+y는 30
      return x + y;
    }
     // 10이 x값, 20이 y값
    console.log(add(10, 20));

    // 기존 함수(표현식)
    // 이름이 없는 함수이기 떄문에 익명함수.
    // 대신 sum라는 변수가 함수를 표현할 수 있음
    let sum = function(x, y){
      return '표현식: ' + (x + y);
    };

    // 화살표 함수
    // sum이라는 변수에 값을 새로 할당
    sum = (x, y) => {
        return '화살표: ' + (x + y);
        };

    // 화살표 함수 축약
    // 실행할 코드가 하나만 있다면 함수 본문의 중괄호 생략 가능
    // 실행할 코드가 하나이기 때문에 return도 생략 가능함
    // 화살표 함수는 자바에서는 람다식이랑 비슷함 
    sum = (x, y) => '화살표 함수 중괄호 생략: ' + (x + y);
   
    // sum의 x y는 30, 40
    console.log(sum(30,40));

    // 기존 함수
    let add10 = function(x){
      return x + 10;
    };

    // 화살표 함수
    // 변수 중복선언 안되니 변수 제거, function도 제거 후 (x) 뒤 => 추가
    add10 = (x) => {
      return x + 10;
    };

    // 화살표 함수 축약
    // 매개변수가 x 하나이기 때문에 ()도 생략 가능함
    add10 = x => x + 10;

    console.log(add10(100))

  </script>
</head>
<body>
  <h1>12-01 화살표 함수</h1>
</body>
</html>
